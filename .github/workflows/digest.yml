# Step 3 -- the Telegram brief, twice a day.
#
# Scheduled a little early because GitHub starts scheduled runs late (often by
# 10-30 minutes): 01:15 UTC = 06:45 IST, 12:15 UTC = 17:45 IST. The brief itself
# says "Morning" before 12:00 IST and "Evening" after.
#
# Secrets: GEMINI_API_KEY (ranking; without it the keyword rules rank),
#          TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID (delivery; without them the brief
#          is only printed and nothing is marked as sent), plus STATE_PASSPHRASE.
name: "3 - Telegram brief"

on:
  schedule:
    - cron: "15 1 * * *"
    - cron: "15 12 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Heading to use"
        type: choice
        options: [auto, morning, evening]
        default: auto
      dry_run:
        description: "Only print the brief on the run page; send nothing, mark nothing"
        type: boolean
        default: false
      backfill_days:
        description: "Instead of a brief: write web editions for this many past days (0 = normal brief)"
        type: string
        default: "0"

permissions:
  contents: write                 # commits docs/ (the web page) to main
  actions: write

concurrency:
  group: collector                # shares the database with the collector; never at the same time
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Get the files
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the libraries
        run: pip install -r requirements.txt

      - name: Restore the saved database
        id: restore
        run: bash state.sh restore

      - name: Build and send the brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS_CSV_URL: ${{ secrets.KEYWORDS_CSV_URL }}
          DIGEST_MAX: ${{ vars.DIGEST_MAX }}
          DIGEST_PER_CATEGORY: ${{ vars.DIGEST_PER_CATEGORY }}
          DIGEST_WEB_MAX: ${{ vars.DIGEST_WEB_MAX }}
          DIGEST_WEB_PER_CATEGORY: ${{ vars.DIGEST_WEB_PER_CATEGORY }}
          DIGEST_WEB_HOURS: ${{ vars.DIGEST_WEB_HOURS }}
          FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
          FEEDBACK_CSV_URL: ${{ secrets.FEEDBACK_CSV_URL }}
        run: |
          python collect.py --init
          if [ "${{ github.event.inputs.backfill_days || '0' }}" != "0" ]; then
            python digest.py --backfill "${{ github.event.inputs.backfill_days }}"
          else
            python digest.py --slot "${{ github.event.inputs.slot || 'auto' }}" \
              ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          fi

      - name: Publish the web page (docs/ -> GitHub Pages)
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "tn-news-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "web page unchanged"
          else
            git commit -m "brief: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Dry run -- keep the page as a downloadable preview
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: brief-preview
          path: docs/
          retention-days: 3
          if-no-files-found: ignore

      - name: Encrypt the database
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: bash state.sh pack

      - name: Save the database for the next run
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: state
          path: state/state.enc
          retention-days: 3
          if-no-files-found: error
