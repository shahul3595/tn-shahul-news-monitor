# Step 1 -- a one-off test: can GitHub's servers collect the news?
# Runs only when you press "Run workflow" on the Actions tab. Stores nothing.
name: "1 - GitHub test run"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the files
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the libraries
        run: pip install -r requirements.txt

      - name: Test Google News, YouTube and the news sites from GitHub
        env:
          # optional -- if these secrets are not set yet, the Telegram check is skipped
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python probe.py
